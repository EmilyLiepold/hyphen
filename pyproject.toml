[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "hyphen"
# license = ["MIT"]
requires-python = ">= 3.8"
dependencies = [
    "numpy", 
    "astropy", 
    "matplotlib", 
    "scipy", 
    "stdatamodels", 
    "jwst", 
    "joblib", 
    "dill",
    "PyYAML",
    "tqdm",
    "pypdf",
]
authors = [
    {name = "Emily Liepold", email = "emilyliepold@berkeley.edu"}
]
description = "This is code which performs de-wiggling of NIRSpec IFU Data"
readme = {file = "README.md", content-type = "text/markdown"}
classifiers= [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/EmilyLiepold/Wiggles"
"Bug Tracker" = "https://github.com/EmilyLiepold/Wiggles/issues"
# Homepage = "https://github.com/EmilyLiepold/hyphen"
# "Bug Tracker" = "https://github.com/EmilyLiepold/hyphen/issues"


[tool.setuptools.dynamic]
version = {attr = "hyphen.__version__"}

[project.scripts]
hyphenate = "hyphen.hyphenate:hyphenate"
