name: Package installation smoke
"on": [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  install:
    # Synthetic tests supplement installation checks, not science validation.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
          git rev-parse HEAD > dist/SOURCE_REVISION
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - name: Check independent artifact installations outside checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          for artifact in "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"/dist/*.tar.gz; do
            venv="$RUNNER_TEMP/$(basename "$artifact").venv"
            test ! -e "$venv"
            python -m venv "$venv"
            "$venv/bin/python" -I -m pip install --no-cache-dir "$artifact"
            "$venv/bin/python" -I -m pip freeze --all > "$GITHUB_WORKSPACE/dist/$(basename "$artifact").requirements.txt"
            "$venv/bin/python" -I -m pip check
            "$venv/bin/python" -I -c 'import hyphen, sys; from pathlib import Path; p = Path(hyphen.__file__).resolve(); print(p); assert p.is_relative_to(Path(sys.prefix).resolve())'
            "$venv/bin/hyphenate" --help
          done
      - name: Run focused tests against the installed wheel
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          shopt -s nullglob
          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "Expected exactly one built wheel" >&2
            exit 1
          fi
          venv="$RUNNER_TEMP/$(basename "${wheels[0]}").venv"
          scratch="$(mktemp -d "$RUNNER_TEMP/hyphen-focused.XXXXXX")"
          for test in test_config.py test_ifu_centering.py test_ifu_orchestration.py test_frame_merger_math.py; do
            test -f "$GITHUB_WORKSPACE/tests/$test"
            cp "$GITHUB_WORKSPACE/tests/$test" "$scratch/$test"
          done
          "$venv/bin/python" -I -m pip install pytest
          "$venv/bin/python" -I -m pip check
          "$venv/bin/python" -I -m pip freeze --all > "$GITHUB_WORKSPACE/dist/focused-tests.requirements.txt"
          cd "$scratch"
          "$venv/bin/python" -I - <<'PY'
          import sys
          from pathlib import Path
          import hyphen
          import pytest

          origin = Path(hyphen.__file__).resolve()
          print(f"Testing installed package: {origin}", flush=True)
          if not origin.is_relative_to(Path(sys.prefix).resolve()):
              raise RuntimeError(f"Package is outside the wheel environment: {origin}")
          raise SystemExit(pytest.main([
              "--import-mode=importlib", "-q", "-p", "no:cacheprovider",
              "test_config.py", "test_ifu_centering.py", "test_ifu_orchestration.py",
              "test_frame_merger_math.py",
          ]))
          PY
      - name: Retain distributions and installation records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-smoke-python313-ubuntu2404
          path: dist/
          if-no-files-found: error
